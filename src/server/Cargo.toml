[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "macros", "chrono"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
thiserror = "1"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Password hashing
bcrypt = "0.15"

# Environment variables
dotenv = "0.15"

# UUID for tracking
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# Testing
tokio-test = "0.4"

#Environment
dotenv = "0.15.0"

#async
async-trait = "0.1.89"
