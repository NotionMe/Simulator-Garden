[package]
name = "server"
version = "0.1.0"
edition = "2024"
[dependencies]
# Web Framework
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5.3"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
# Database
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "chrono"] }
# Date/Time
chrono = { version = "0.4", features = ["serde"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error Handling
thiserror = "2.0.18"
# Async utilities
futures = "0.3"
async-trait = "0.1"
# Environment variables
dotenv = "0.15"
# UUID for tracking
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
[dev-dependencies]
# Testing
tokio-test = "0.4"
#Environment
dotenv = "0.15.0"
#async
async-trait = "0.1.89"
#hashing
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }