name: Release — Build Installers

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-installers:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install WiX Toolset (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset --yes

      - name: Install RPM packaging tools (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build Fat JAR with dependencies
        run: mvn clean package -DskipTests

      - name: Prepare jpackage input
        run: |
          mkdir -p jpackage-input
          cp target/garden-simulator-1.0.0-jar-with-dependencies.jar jpackage-input/

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Package installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path "packaging/windows/garden-simulator.ico") {
            jpackage `
              --type msi `
              --name "Garden Simulator" `
              --app-version "${{ steps.version.outputs.VERSION }}" `
              --vendor "Notion" `
              --input jpackage-input/ `
              --main-jar garden-simulator-1.0.0-jar-with-dependencies.jar `
              --main-class ua.notion.Launcher `
              --icon packaging/windows/garden-simulator.ico `
              --dest dist/ `
              --win-dir-chooser `
              --win-menu `
              --win-shortcut
          } else {
            jpackage `
              --type msi `
              --name "Garden Simulator" `
              --app-version "${{ steps.version.outputs.VERSION }}" `
              --vendor "Notion" `
              --input jpackage-input/ `
              --main-jar garden-simulator-1.0.0-jar-with-dependencies.jar `
              --main-class ua.notion.Launcher `
              --dest dist/ `
              --win-dir-chooser `
              --win-menu `
              --win-shortcut
          }

      - name: Package installer (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          if [ -f "packaging/macos/garden-simulator.icns" ]; then
            jpackage \
              --type dmg \
              --name "Garden Simulator" \
              --app-version "${{ steps.version.outputs.VERSION }}" \
              --vendor "Notion" \
              --input jpackage-input/ \
              --main-jar garden-simulator-1.0.0-jar-with-dependencies.jar \
              --main-class ua.notion.Launcher \
              --icon packaging/macos/garden-simulator.icns \
              --dest dist/
          else
            jpackage \
              --type dmg \
              --name "Garden Simulator" \
              --app-version "${{ steps.version.outputs.VERSION }}" \
              --vendor "Notion" \
              --input jpackage-input/ \
              --main-jar garden-simulator-1.0.0-jar-with-dependencies.jar \
              --main-class ua.notion.Launcher \
              --dest dist/
          fi

      - name: Package installer (Linux DEB & RPM)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ICON_FLAG=""
          if [ -f "packaging/linux/garden-simulator.svg" ]; then
            ICON_FLAG="--icon packaging/linux/garden-simulator.svg"
          elif [ -f "packaging/linux/garden-simulator.png" ]; then
            ICON_FLAG="--icon packaging/linux/garden-simulator.png"
          fi

          jpackage \
            --type deb \
            --name "garden-simulator" \
            --app-version "${{ steps.version.outputs.VERSION }}" \
            --vendor "Notion" \
            --input jpackage-input/ \
            --main-jar garden-simulator-1.0.0-jar-with-dependencies.jar \
            --main-class ua.notion.Launcher \
            $ICON_FLAG \
            --dest dist/ \
            --linux-shortcut

          jpackage \
            --type rpm \
            --name "garden-simulator" \
            --app-version "${{ steps.version.outputs.VERSION }}" \
            --vendor "Notion" \
            --input jpackage-input/ \
            --main-jar garden-simulator-1.0.0-jar-with-dependencies.jar \
            --main-class ua.notion.Launcher \
            $ICON_FLAG \
            --dest dist/ \
            --linux-shortcut

          cp target/garden-simulator-1.0.0-jar-with-dependencies.jar dist/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/
          retention-days: 1

  publish-release:
    needs: build-installers
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Garden Simulator ${{ github.ref_name }}"
          body: |
            ## 🌱 Garden Simulator - Release ${{ github.ref_name }}

            Оновлений реліз Garden Simulator — симулятора управління садом з клієнт-серверною архітектурою.

            ### ✨ Основні можливості

            - 🔐 **Автентифікація** — система реєстрації та входу через JWT
            - 🏡 **Управління садами** — створення та керування садами в реальному часі
            - 🌿 **Каталог рослин** — великий вибір культур з різними параметрами росту
            - 🛒 **Магазин та інвентар** — купівля насіння та управління ресурсами гравця
            - ✅ **Система завдань** — щоденні квести та відстеження прогресу
            - 🏆 **Досягнення** — система нагород за ігрові успіхи
            - 🌤 **Погодні події** — динамічна зміна погоди, що впливає на ріст рослин
            - 🎨 **Сучасний UI** — JavaFX з темою AtlantaFX та ігровими асетами

            ### 🛠 Технічний стек

            - **Client:** Java 21, JavaFX, Google Guice (DI), WebSockets
            - **Server:** Rust, Axum, Tokio (Async runtime)
            - **Database:** PostgreSQL (на стороні сервера)
            - **Communication:** JSON payloads через HTTP та WebSockets
            - **Security:** Argon2 (паролі), JWT (авторизація)

            ### 📦 Завантаження

            | Операційна система | Файл | Опис |
            |---|---|---|
            | 🪟 Windows 10/11 | `*.msi` | MSI інсталятор з ярликами |
            | 🍎 macOS 12+ | `*.dmg` | DMG образ для інсталяції |
            | 🐧 Ubuntu/Debian | `*.deb` | DEB пакет |
            | 🐧 Fedora/RedHat | `*.rpm` | RPM пакет |
            | ☕ Будь-яка платформа | `*.jar` | Fat JAR (потребує JRE 21+) |

            ### 📝 Встановлення та запуск

            **Windows/macOS:** Запустіть завантажений файл та дотримуйтесь інструкцій.
            **Linux:** Скористайтеся менеджером пакетів (`dpkg -i` або `rpm -i`).
            **Universal JAR:** `java -jar garden-simulator-1.0.0-jar-with-dependencies.jar`

            > **Примітка:** Для роботи клієнта необхідний запущений сервер Garden Simulator.

            ### 🚀 Плани на майбутнє

            - Покращення ігрової механіки симуляції
            - Мультиплеєрні режими
            - Мобільна версія клієнта
          files: installers/**
          draft: false
          prerelease: false
